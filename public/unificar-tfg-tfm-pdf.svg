<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 480" width="1200" height="480">
  <defs>
    <!-- Crisp High-Contrast Solid Drop Shadows -->
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="6" stdDeviation="12" flood-color="#0F172A" flood-opacity="0.06" />
    </filter>
    <filter id="arrowShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#EC3C2D" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- ========================================================================= -->
  <!-- 1. LEFT COLUMN: 3 LARGE SOURCE INPUT CARDS (Wider with generous margins)   -->
  <!-- ========================================================================= -->
  <g transform="translate(10, 15)">
    
    <!-- 01 Portada institucional -->
    <g filter="url(#cardShadow)">
      <rect width="470" height="135" rx="20" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="2" />
      <circle cx="68" cy="67" r="42" fill="#059669" />
      <text x="68" y="80" text-anchor="middle" fill="#FFFFFF" font-family="system-ui, -apple-system, sans-serif" font-size="34" font-weight="900">01</text>
      <text x="130" y="56" fill="#0F172A" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="900">Portada institucional</text>
      <text x="130" y="91" fill="#475569" font-family="system-ui, -apple-system, sans-serif" font-size="17.5" font-weight="700">Plantilla oficial de tu facultad</text>
    </g>

    <!-- 02 Memoria del trabajo -->
    <g transform="translate(0, 158)" filter="url(#cardShadow)">
      <rect width="470" height="135" rx="20" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="2" />
      <circle cx="68" cy="67" r="42" fill="#059669" />
      <text x="68" y="80" text-anchor="middle" fill="#FFFFFF" font-family="system-ui, -apple-system, sans-serif" font-size="34" font-weight="900">02</text>
      <text x="130" y="56" fill="#0F172A" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="900">Memoria del trabajo</text>
      <text x="130" y="91" fill="#475569" font-family="system-ui, -apple-system, sans-serif" font-size="17.5" font-weight="700">Cuerpo con índice y bibliografía</text>
    </g>

    <!-- 03 Anexos y certificados -->
    <g transform="translate(0, 316)" filter="url(#cardShadow)">
      <rect width="470" height="135" rx="20" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="2" />
      <circle cx="68" cy="67" r="42" fill="#059669" />
      <text x="68" y="80" text-anchor="middle" fill="#FFFFFF" font-family="system-ui, -apple-system, sans-serif" font-size="34" font-weight="900">03</text>
      <text x="130" y="56" fill="#0F172A" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="900">Anexos y certificados</text>
      <text x="130" y="91" fill="#475569" font-family="system-ui, -apple-system, sans-serif" font-size="17.5" font-weight="700">Encuestas, tablas, gráficos o planos</text>
    </g>
  </g>

  <!-- ========================================================================= -->
  <!-- 2. CENTER: PERFECTLY CENTERED BREADPDF ARROW + UNIFICACIÓN                -->
  <!-- ========================================================================= -->
  <!-- Center aligned at X=605 (midpoint between 480 and 730)                      -->
  <!-- ========================================================================= -->
  <g transform="translate(537, 137)">
    <circle cx="68" cy="68" r="68" fill="#EC3C2D" filter="url(#arrowShadow)" />
    <path d="M48 68 L88 68 M70 50 L90 68 L70 86" fill="none" stroke="#FFFFFF" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" />
    <text x="68" y="170" text-anchor="middle" fill="#0F172A" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="900" letter-spacing="0.1em">UNIFICACIÓN</text>
  </g>

  <!-- ========================================================================= -->
  <!-- 3. RIGHT COLUMN: LARGE FINAL MASTER PDF (Balanced Green Tick Circles)     -->
  <!-- ========================================================================= -->
  <g transform="translate(735, 15)" filter="url(#cardShadow)">
    <!-- Solid White Document Container -->
    <rect width="455" height="450" rx="24" fill="#FFFFFF" stroke="#0F172A" stroke-width="3" />
    
    <!-- Top PDF Document Identity Section -->
    <g transform="translate(28, 30)">
      <rect width="399" height="88" rx="18" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="2" />
      
      <!-- Solid Red PDF Badge -->
      <rect x="20" y="20" width="56" height="48" rx="10" fill="#EC3C2D" />
      <text x="48" y="52" text-anchor="middle" fill="#FFFFFF" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="900">PDF</text>
      
      <!-- Filename (Large, Bold Navy) -->
      <text x="92" y="54" fill="#0F172A" font-family="system-ui, -apple-system, sans-serif" font-size="20.5" font-weight="900">TFG_Apellido_Nombre.pdf</text>
    </g>

    <!-- Balanced Functional Check Items (Green Circles refined to 38px) -->
    <g transform="translate(34, 152)">
      <!-- Check 1 -->
      <g transform="translate(0, 0)">
        <circle cx="19" cy="19" r="19" fill="#059669" />
        <path d="M11 19 L17 25 L27 13" fill="none" stroke="#FFFFFF" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" />
        <text x="54" y="26" fill="#0F172A" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="900">Foliación correcta</text>
      </g>

      <!-- Check 2 -->
      <g transform="translate(0, 64)">
        <circle cx="19" cy="19" r="19" fill="#059669" />
        <path d="M11 19 L17 25 L27 13" fill="none" stroke="#FFFFFF" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" />
        <text x="54" y="26" fill="#0F172A" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="900">Fuentes y tablas nítidas</text>
      </g>

      <!-- Check 3 -->
      <g transform="translate(0, 128)">
        <circle cx="19" cy="19" r="19" fill="#059669" />
        <path d="M11 19 L17 25 L27 13" fill="none" stroke="#FFFFFF" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" />
        <text x="54" y="26" fill="#0F172A" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="900">Peso verificado</text>
      </g>
    </g>

    <!-- Solid Final State Bar (BreadPDF Brand Red, Generous & Clean) -->
    <g transform="translate(24, 350)">
      <rect width="407" height="74" rx="20" fill="#EC3C2D" filter="url(#cardShadow)" />
      <!-- White Checkmark Icon Circle -->
      <circle cx="48" cy="37" r="18" fill="#FFFFFF" />
      <path d="M40 37 L46 43 L56 31" fill="none" stroke="#EC3C2D" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" />
      <text x="238" y="46" text-anchor="middle" fill="#FFFFFF" font-family="system-ui, -apple-system, sans-serif" font-size="23" font-weight="900" letter-spacing="0.01em">Listo para entrega</text>
    </g>
  </g>
</svg>

