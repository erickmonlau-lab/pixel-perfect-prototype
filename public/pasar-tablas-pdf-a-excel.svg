<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="excel-header" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#047857" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
    <linearGradient id="card-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#334155" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)" />

  <!-- Subtle grid lines -->
  <g opacity="0.05" stroke="#ffffff" stroke-width="1">
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" />
    </pattern>
    <rect width="1200" height="630" fill="url(#grid)" />
  </g>

  <!-- Top Badge / Header -->
  <g transform="translate(100, 50)">
    <rect x="0" y="0" width="370" height="40" rx="20" fill="#064e3b" stroke="#10b981" stroke-width="1.5" />
    <circle cx="20" cy="20" r="7" fill="#34d399" />
    <text x="36" y="25" fill="#a7f3d0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700" letter-spacing="1">GESTIÓN DOCUMENTAL • FINANZAS</text>
  </g>

  <text x="100" y="130" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="34" font-weight="800" letter-spacing="-0.5">
    Cómo pasar tablas de un PDF a Excel manteniendo columnas
  </text>
  <text x="100" y="166" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="17" font-weight="500">
    De coordenadas de dibujo visual a celdas estructuradas: detección geométrica y auditoría posterior
  </text>

  <!-- Left: PDF Visual Table (No Native Grid) -->
  <g transform="translate(80, 220)" filter="url(#shadow)">
    <rect width="320" height="320" rx="16" fill="#1e293b" stroke="#475569" stroke-width="2" />
    <rect x="20" y="20" width="280" height="34" rx="8" fill="#334155" />
    <text x="160" y="43" fill="#cbd5e1" font-family="sans-serif" font-size="13" font-weight="700" text-anchor="middle">PDF: DIBUJO VISUAL (TEXT STREAMS)</text>

    <text x="25" y="80" fill="#94a3b8" font-family="sans-serif" font-size="11" font-weight="600">Representación gráfica por coordenadas (X, Y):</text>

    <!-- Simulated PDF Table without real cell grid -->
    <g transform="translate(25, 95)">
      <!-- Header row line -->
      <line x1="0" y1="26" x2="270" y2="26" stroke="#64748b" stroke-width="1.5" />
      <text x="10" y="18" fill="#f8fafc" font-family="sans-serif" font-size="11" font-weight="700">CONCEPTO</text>
      <text x="125" y="18" fill="#f8fafc" font-family="sans-serif" font-size="11" font-weight="700">FECHA</text>
      <text x="205" y="18" fill="#f8fafc" font-family="sans-serif" font-size="11" font-weight="700">TOTAL</text>

      <!-- Row 1 -->
      <text x="10" y="52" fill="#cbd5e1" font-family="sans-serif" font-size="11">Factura F-01</text>
      <text x="125" y="52" fill="#cbd5e1" font-family="sans-serif" font-size="11">12/03/2026</text>
      <text x="205" y="52" fill="#cbd5e1" font-family="sans-serif" font-size="11">1.240,50 €</text>

      <!-- Row 2 -->
      <text x="10" y="82" fill="#cbd5e1" font-family="sans-serif" font-size="11">Servicio Cloud</text>
      <text x="125" y="82" fill="#cbd5e1" font-family="sans-serif" font-size="11">15/03/2026</text>
      <text x="205" y="82" fill="#cbd5e1" font-family="sans-serif" font-size="11">420,00 €</text>

      <!-- Row 3 with merged visual layout -->
      <text x="10" y="112" fill="#cbd5e1" font-family="sans-serif" font-size="11">Mantenimiento</text>
      <text x="125" y="112" fill="#cbd5e1" font-family="sans-serif" font-size="11">20/03/2026</text>
      <text x="205" y="112" fill="#cbd5e1" font-family="sans-serif" font-size="11">890,25 €</text>

      <line x1="0" y1="130" x2="270" y2="130" stroke="#475569" stroke-width="1" />
      <text x="10" y="152" fill="#38bdf8" font-family="sans-serif" font-size="10" font-style="italic">Sin estructura de celdas nativa</text>
      <text x="10" y="168" fill="#64748b" font-family="sans-serif" font-size="10">Los textos flotan sobre el lienzo digital</text>
    </g>
  </g>

  <!-- Center Arrow / Conversion Logic -->
  <g transform="translate(425, 300)">
    <rect width="170" height="150" rx="14" fill="#0f172a" stroke="#10b981" stroke-width="1.5" />
    <text x="85" y="28" fill="#34d399" font-family="sans-serif" font-size="12" font-weight="700" text-anchor="middle">BreadPDF ENGINE</text>
    <line x1="20" y1="38" x2="150" y2="38" stroke="#334155" stroke-width="1" />
    <text x="85" y="60" fill="#f8fafc" font-family="sans-serif" font-size="11" text-anchor="middle">Agrupación X/Y</text>
    <text x="85" y="80" fill="#94a3b8" font-family="sans-serif" font-size="10" text-anchor="middle">Tolerancia de columnas</text>
    <text x="85" y="100" fill="#94a3b8" font-family="sans-serif" font-size="10" text-anchor="middle">Generación de celdas</text>
    <polygon points="180,75 195,75 195,70 205,80 195,90 195,85 180,85" fill="#10b981" />
  </g>

  <!-- Right: Excel Spreadsheet Grid -->
  <g transform="translate(650, 220)" filter="url(#shadow)">
    <rect width="470" height="320" rx="16" fill="#1e293b" stroke="#10b981" stroke-width="2" />
    
    <!-- Excel Header Bar -->
    <rect x="0" y="0" width="470" height="42" rx="16" fill="url(#excel-header)" />
    <text x="25" y="27" fill="#ffffff" font-family="sans-serif" font-size="14" font-weight="700">HOJA EXCEL RESULTANTE (.XLSX)</text>
    <rect x="360" y="10" width="90" height="22" rx="4" fill="#064e3b" />
    <text x="405" y="25" fill="#a7f3d0" font-family="sans-serif" font-size="11" font-weight="700" text-anchor="middle">COLUMNAS</text>

    <!-- Spreadsheet Grid -->
    <g transform="translate(20, 60)">
      <!-- Column Headers: A, B, C -->
      <rect x="0" y="0" width="30" height="24" fill="#0f172a" stroke="#334155" stroke-width="1" />
      <rect x="30" y="0" width="160" height="24" fill="#0f172a" stroke="#334155" stroke-width="1" />
      <text x="110" y="16" fill="#94a3b8" font-family="monospace" font-size="11" font-weight="700" text-anchor="middle">A (Concepto)</text>

      <rect x="190" y="0" width="110" height="24" fill="#0f172a" stroke="#334155" stroke-width="1" />
      <text x="245" y="16" fill="#94a3b8" font-family="monospace" font-size="11" font-weight="700" text-anchor="middle">B (Fecha)</text>

      <rect x="300" y="0" width="130" height="24" fill="#0f172a" stroke="#334155" stroke-width="1" />
      <text x="365" y="16" fill="#94a3b8" font-family="monospace" font-size="11" font-weight="700" text-anchor="middle">C (Importe)</text>

      <!-- Row 1 -->
      <rect x="0" y="24" width="30" height="32" fill="#0f172a" stroke="#334155" stroke-width="1" />
      <text x="15" y="44" fill="#64748b" font-family="monospace" font-size="11" text-anchor="middle">1</text>
      <rect x="30" y="24" width="160" height="32" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <text x="40" y="44" fill="#f8fafc" font-family="sans-serif" font-size="12">Factura F-01</text>
      <rect x="190" y="24" width="110" height="32" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <text x="200" y="44" fill="#cbd5e1" font-family="sans-serif" font-size="12">12/03/2026</text>
      <rect x="300" y="24" width="130" height="32" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <text x="415" y="44" fill="#a7f3d0" font-family="monospace" font-size="12" font-weight="700" text-anchor="end">1.240,50</text>

      <!-- Row 2 -->
      <rect x="0" y="56" width="30" height="32" fill="#0f172a" stroke="#334155" stroke-width="1" />
      <text x="15" y="76" fill="#64748b" font-family="monospace" font-size="11" text-anchor="middle">2</text>
      <rect x="30" y="56" width="160" height="32" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <text x="40" y="76" fill="#f8fafc" font-family="sans-serif" font-size="12">Servicio Cloud</text>
      <rect x="190" y="56" width="110" height="32" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <text x="200" y="76" fill="#cbd5e1" font-family="sans-serif" font-size="12">15/03/2026</text>
      <rect x="300" y="56" width="130" height="32" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <text x="415" y="76" fill="#a7f3d0" font-family="monospace" font-size="12" font-weight="700" text-anchor="end">420,00</text>

      <!-- Row 3 -->
      <rect x="0" y="88" width="30" height="32" fill="#0f172a" stroke="#334155" stroke-width="1" />
      <text x="15" y="108" fill="#64748b" font-family="monospace" font-size="11" text-anchor="middle">3</text>
      <rect x="30" y="88" width="160" height="32" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <text x="40" y="108" fill="#f8fafc" font-family="sans-serif" font-size="12">Mantenimiento</text>
      <rect x="190" y="88" width="110" height="32" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <text x="200" y="108" fill="#cbd5e1" font-family="sans-serif" font-size="12">20/03/2026</text>
      <rect x="300" y="88" width="130" height="32" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <text x="415" y="108" fill="#a7f3d0" font-family="monospace" font-size="12" font-weight="700" text-anchor="end">890,25</text>

      <!-- Row 4: Total calculation check -->
      <rect x="0" y="120" width="30" height="32" fill="#0f172a" stroke="#334155" stroke-width="1" />
      <text x="15" y="140" fill="#64748b" font-family="monospace" font-size="11" text-anchor="middle">4</text>
      <rect x="30" y="120" width="270" height="32" fill="#064e3b" stroke="#10b981" stroke-width="1" />
      <text x="40" y="140" fill="#ffffff" font-family="sans-serif" font-size="12" font-weight="700">TOTAL SUMA AUDITADA:</text>
      <rect x="300" y="120" width="130" height="32" fill="#064e3b" stroke="#10b981" stroke-width="1" />
      <text x="415" y="140" fill="#34d399" font-family="monospace" font-size="12" font-weight="700" text-anchor="end">2.550,75</text>
    </g>

    <text x="20" y="245" fill="#a7f3d0" font-family="sans-serif" font-size="11" font-weight="600">✓ Celdas independientes listas para fórmulas y filtros</text>
    <text x="20" y="262" fill="#94a3b8" font-family="sans-serif" font-size="10.5">Paso imprescindible: verificar que la suma en Excel coincide con el total del PDF original</text>
  </g>

  <!-- Footer Disclaimer -->
  <g transform="translate(100, 585)">
    <text x="0" y="0" fill="#64748b" font-family="sans-serif" font-size="12">
      * Factual disclaimer: La estructura del PDF determina el resultado. La verificación humana de totales y decimales forma parte imprescindible del flujo contable.
    </text>
  </g>
</svg>
