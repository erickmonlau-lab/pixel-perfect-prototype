<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="shield-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
    <linearGradient id="card-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#334155" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)" />

  <!-- Subtle grid pattern -->
  <g opacity="0.05" stroke="#ffffff" stroke-width="1">
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" />
    </pattern>
    <rect width="1200" height="630" fill="url(#grid)" />
  </g>

  <!-- Top Badge / Header -->
  <g transform="translate(100, 50)">
    <rect x="0" y="0" width="340" height="40" rx="20" fill="#1e3a8a" stroke="#3b82f6" stroke-width="1.5" />
    <circle cx="20" cy="20" r="7" fill="#60a5fa" />
    <text x="36" y="25" fill="#93c5fd" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700" letter-spacing="1">PRIVACIDAD DOCUMENTAL • BreadPDF</text>
  </g>

  <text x="100" y="130" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="34" font-weight="800" letter-spacing="-0.5">
    Cómo ocultar datos personales en un PDF antes de compartir
  </text>
  <text x="100" y="166" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="17" font-weight="500">
    Auditoría técnica en tres capas: Censura visual, Purga de metadatos y Saneamiento de scripts
  </text>

  <!-- Pipeline Flow Visual -->
  <!-- Step 1: Documento Original con Datos -->
  <g transform="translate(80, 220)" filter="url(#shadow)">
    <rect width="220" height="310" rx="16" fill="#1e293b" stroke="#475569" stroke-width="2" />
    <rect x="20" y="20" width="180" height="32" rx="8" fill="#334155" />
    <text x="110" y="42" fill="#cbd5e1" font-family="sans-serif" font-size="13" font-weight="700" text-anchor="middle">PDF ORIGINAL</text>

    <!-- Document simulation with exposed data -->
    <rect x="25" y="75" width="170" height="10" rx="3" fill="#475569" />
    <rect x="25" y="95" width="120" height="10" rx="3" fill="#475569" />

    <!-- Red Exposed fields -->
    <rect x="25" y="125" width="170" height="24" rx="4" fill="#7f1d1d" stroke="#ef4444" stroke-width="1" />
    <text x="35" y="141" fill="#fca5a5" font-family="monospace" font-size="11">DNI: 48123982X</text>

    <rect x="25" y="160" width="170" height="24" rx="4" fill="#7f1d1d" stroke="#ef4444" stroke-width="1" />
    <text x="35" y="176" fill="#fca5a5" font-family="monospace" font-size="11">Email: juan@empresa.com</text>

    <rect x="25" y="195" width="170" height="24" rx="4" fill="#7f1d1d" stroke="#ef4444" stroke-width="1" />
    <text x="35" y="211" fill="#fca5a5" font-family="monospace" font-size="11">Firma / Rúbrica</text>

    <!-- Metadata warning -->
    <rect x="25" y="245" width="170" height="42" rx="6" fill="#451a03" stroke="#f59e0b" stroke-width="1" />
    <text x="35" y="262" fill="#fcd34d" font-family="sans-serif" font-size="10" font-weight="700">METADATOS OCULTOS</text>
    <text x="35" y="277" fill="#fed7aa" font-family="sans-serif" font-size="9">Autor: Juan Perez (MacBook-Pro)</text>
  </g>

  <!-- Arrow 1 -->
  <g transform="translate(315, 360)">
    <line x1="0" y1="0" x2="35" y2="0" stroke="#64748b" stroke-width="3" stroke-dasharray="6,4" />
    <polygon points="35,-6 47,0 35,6" fill="#64748b" />
  </g>

  <!-- Step 2: Protocolo de Revisión Técnica BreadPDF (Center Card) -->
  <g transform="translate(375, 205)" filter="url(#shadow)">
    <rect width="450" height="340" rx="20" fill="url(#card-grad)" stroke="#3b82f6" stroke-width="2" />
    
    <!-- Header of Processor -->
    <rect x="0" y="0" width="450" height="54" rx="20" fill="#1e3a8a" />
    <text x="225" y="34" fill="#ffffff" font-family="sans-serif" font-size="16" font-weight="700" text-anchor="middle" letter-spacing="0.5">
      3 CAPAS DE INSPECCIÓN TÉCNICA (CLIENT-SIDE)
    </text>

    <!-- 1. Censura Visual -->
    <g transform="translate(25, 75)">
      <rect width="400" height="70" rx="10" fill="#0f172a" stroke="#475569" stroke-width="1" />
      <circle cx="35" cy="35" r="18" fill="#1e293b" />
      <text x="35" y="40" fill="#38bdf8" font-family="sans-serif" font-size="14" font-weight="700" text-anchor="middle">1</text>
      <text x="65" y="28" fill="#f8fafc" font-family="sans-serif" font-size="14" font-weight="700">Censura de Capa Visual</text>
      <text x="65" y="48" fill="#94a3b8" font-family="sans-serif" font-size="11.5">Superposición de bloques opacos permanentes sobre DNI, firmas y nombres</text>
      <rect x="300" y="24" width="85" height="22" rx="4" fill="#0284c7" />
      <text x="342" y="39" fill="#ffffff" font-family="sans-serif" font-size="10" font-weight="700" text-anchor="middle">Censurar PDF</text>
    </g>

    <!-- 2. Purga de Metadatos -->
    <g transform="translate(25, 160)">
      <rect width="400" height="70" rx="10" fill="#0f172a" stroke="#475569" stroke-width="1" />
      <circle cx="35" cy="35" r="18" fill="#1e293b" />
      <text x="35" y="40" fill="#a855f7" font-family="sans-serif" font-size="14" font-weight="700" text-anchor="middle">2</text>
      <text x="65" y="28" fill="#f8fafc" font-family="sans-serif" font-size="14" font-weight="700">Eliminación de Metadatos</text>
      <text x="65" y="48" fill="#94a3b8" font-family="sans-serif" font-size="11.5">Purga de Author, Creator, Producer, Fechas y streams XMP del catálogo</text>
      <rect x="290" y="24" width="95" height="22" rx="4" fill="#7e22ce" />
      <text x="337" y="39" fill="#ffffff" font-family="sans-serif" font-size="10" font-weight="700" text-anchor="middle">Limpiar Metadatos</text>
    </g>

    <!-- 3. Saneamiento Técnico -->
    <g transform="translate(25, 245)">
      <rect width="400" height="70" rx="10" fill="#0f172a" stroke="#475569" stroke-width="1" />
      <circle cx="35" cy="35" r="18" fill="#1e293b" />
      <text x="35" y="40" fill="#10b981" font-family="sans-serif" font-size="14" font-weight="700" text-anchor="middle">3</text>
      <text x="65" y="28" fill="#f8fafc" font-family="sans-serif" font-size="14" font-weight="700">Saneamiento de Elementos Técnicos</text>
      <text x="65" y="48" fill="#94a3b8" font-family="sans-serif" font-size="11.5">Elimina scripts JavaScript incrustados (/JavaScript) y acciones (/OpenAction)</text>
      <rect x="305" y="24" width="80" height="22" rx="4" fill="#047857" />
      <text x="345" y="39" fill="#ffffff" font-family="sans-serif" font-size="10" font-weight="700" text-anchor="middle">Sanear PDF</text>
    </g>
  </g>

  <!-- Arrow 2 -->
  <g transform="translate(840, 360)">
    <line x1="0" y1="0" x2="35" y2="0" stroke="#10b981" stroke-width="3" />
    <polygon points="35,-6 47,0 35,6" fill="#10b981" />
  </g>

  <!-- Step 3: Documento Auditado -->
  <g transform="translate(900, 220)" filter="url(#shadow)">
    <rect width="220" height="310" rx="16" fill="#1e293b" stroke="#10b981" stroke-width="2" />
    <rect x="20" y="20" width="180" height="32" rx="8" fill="#064e3b" />
    <text x="110" y="42" fill="#a7f3d0" font-family="sans-serif" font-size="13" font-weight="700" text-anchor="middle">PDF REVISADO</text>

    <!-- Standard content -->
    <rect x="25" y="75" width="170" height="10" rx="3" fill="#475569" />
    <rect x="25" y="95" width="120" height="10" rx="3" fill="#475569" />

    <!-- Opaque censorship blocks -->
    <rect x="25" y="125" width="170" height="24" rx="4" fill="#020617" stroke="#334155" stroke-width="1" />
    <rect x="35" y="132" width="120" height="10" rx="2" fill="#000000" />

    <rect x="25" y="160" width="170" height="24" rx="4" fill="#020617" stroke="#334155" stroke-width="1" />
    <rect x="35" y="167" width="140" height="10" rx="2" fill="#000000" />

    <rect x="25" y="195" width="170" height="24" rx="4" fill="#020617" stroke="#334155" stroke-width="1" />
    <rect x="35" y="202" width="100" height="10" rx="2" fill="#000000" />

    <!-- Cleared metadata block -->
    <rect x="25" y="245" width="170" height="42" rx="6" fill="#064e3b" stroke="#10b981" stroke-width="1" />
    <text x="35" y="262" fill="#6ee7b7" font-family="sans-serif" font-size="10" font-weight="700">PROPIEDADES PURGADAS</text>
    <text x="35" y="277" fill="#d1fae5" font-family="sans-serif" font-size="9">Metadatos y Scripts: Limpios</text>
  </g>

  <!-- Footer Disclaimer / Factual Rigor -->
  <g transform="translate(100, 580)">
    <text x="0" y="0" fill="#64748b" font-family="sans-serif" font-size="12">
      * Nota de rigor técnico: Ocultar datos o eliminar metadatos no equivale por sí mismo a una anonimización jurídica en el sentido del RGPD.
    </text>
  </g>
</svg>
