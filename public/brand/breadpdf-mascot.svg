<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 110" fill="none">
  <defs>
    <linearGradient id="mascot-crust" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#DE834C"/>
      <stop offset="100%" stop-color="#B85D25"/>
    </linearGradient>
    <linearGradient id="mascot-crumb" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFF5E9"/>
      <stop offset="100%" stop-color="#FEE7CE"/>
    </linearGradient>
    <filter id="mascot-drop" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#592316" flood-opacity="0.18"/>
    </filter>
  </defs>

  <!-- Floor shadow under character -->
  <ellipse cx="50" cy="98" rx="42" ry="6.5" fill="#592316" opacity="0.14"/>

  <!-- Feet -->
  <ellipse cx="36" cy="94" rx="9.5" ry="5.5" fill="#421A0F"/>
  <ellipse cx="72" cy="94" rx="9.5" ry="5.5" fill="#421A0F"/>

  <!-- Toast Crust -->
  <path d="M22 18 C14 18 8 24 8 34 C8 42 12 48 10 56 C8 66 10 84 18 86 C28 88 66 88 76 86 C84 84 86 66 84 56 C82 48 86 42 86 34 C86 24 80 18 72 18 C64 18 58 24 47 24 C36 24 30 18 22 18 Z" fill="url(#mascot-crust)" stroke="#421A0F" stroke-width="4" stroke-linejoin="round" filter="url(#mascot-drop)"/>

  <!-- Toast Face/Crumb -->
  <path d="M24 24 C18 24 14 28 14 36 C14 42 17 48 16 56 C14 64 16 80 22 82 C30 84 64 84 72 82 C78 80 80 64 78 56 C77 48 80 42 80 36 C80 28 76 24 70 24 C62 24 57 29 47 29 C37 29 32 24 24 24 Z" fill="url(#mascot-crumb)"/>

  <!-- Joyful Eyes (Fully Visible) -->
  <path d="M28 40 Q 33 33 38 40" stroke="#421A0F" stroke-width="4.5" stroke-linecap="round" fill="none"/>
  <path d="M52 40 Q 57 33 62 40" stroke="#421A0F" stroke-width="4.5" stroke-linecap="round" fill="none"/>

  <!-- Cheeks -->
  <ellipse cx="26" cy="48" rx="4.5" ry="2.8" fill="#F87171" opacity="0.65"/>
  <ellipse cx="64" cy="48" rx="4.5" ry="2.8" fill="#F87171" opacity="0.65"/>

  <!-- Open Happy Smile (Fully Visible, not covered) -->
  <path d="M39 46 Q 45 55 51 46 Z" fill="#421A0F"/>
  <path d="M41.5 49 Q 45 54 48.5 49 Z" fill="#EF4444"/>

  <!-- Left arm & hand holding doc from side -->
  <path d="M22 62 C26 62 34 68 36 74" stroke="#421A0F" stroke-width="5.5" stroke-linecap="round"/>
  <ellipse cx="37" cy="74" rx="6" ry="5" fill="#421A0F"/>

  <!-- Document tilted to the right and lower down so face is 100% unobstructed -->
  <g transform="translate(42, 48) rotate(8)" filter="url(#mascot-drop)">
    <!-- Sheet -->
    <path d="M0 0 L24 0 L36 12 L36 46 L0 46 Z" fill="#FFFFFF" stroke="#421A0F" stroke-width="3" stroke-linejoin="round"/>
    <!-- Fold -->
    <path d="M24 0 L24 12 L36 12 Z" fill="#E2E8F0" stroke="#421A0F" stroke-width="2.5" stroke-linejoin="round"/>
    <!-- Red PDF Badge -->
    <rect x="4" y="16" width="28" height="17" rx="4" fill="#EC3C2D"/>
    <text x="18" y="29" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-weight="900" font-size="11" fill="#FFFFFF" text-anchor="middle" letter-spacing="0.5">PDF</text>
  </g>

  <!-- Right hand holding doc from the right side -->
  <ellipse cx="82" cy="74" rx="5.5" ry="6.5" fill="#421A0F" transform="rotate(15 82 74)"/>

  <!-- Exclamation sparkles top right -->
  <path d="M92 20 L96 12" stroke="#EC3C2D" stroke-width="3.5" stroke-linecap="round"/>
  <path d="M99 26 L107 22" stroke="#EC3C2D" stroke-width="3.5" stroke-linecap="round"/>
</svg>
