<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="card-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#334155" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)" />

  <!-- Subtle grid lines -->
  <g opacity="0.05" stroke="#ffffff" stroke-width="1">
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" />
    </pattern>
    <rect width="1200" height="630" fill="url(#grid)" />
  </g>

  <!-- Top Badge / Header -->
  <g transform="translate(100, 50)">
    <rect x="0" y="0" width="375" height="40" rx="20" fill="#0c4a6e" stroke="#0284c7" stroke-width="1.5" />
    <circle cx="20" cy="20" r="7" fill="#38bdf8" />
    <text x="36" y="25" fill="#bae6fd" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700" letter-spacing="1">GESTIÓN ADMINISTRATIVA • FORMULARIOS</text>
  </g>

  <text x="100" y="130" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="34" font-weight="800" letter-spacing="-0.5">
    Cómo rellenar y firmar un formulario PDF desde el navegador
  </text>
  <text x="100" y="166" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="17" font-weight="500">
    Completado de campos AcroForm nativos y estampación de firma visual o rúbrica
  </text>

  <!-- Left: Form Input Fields (AcroForm) -->
  <g transform="translate(80, 220)" filter="url(#shadow)">
    <rect width="320" height="320" rx="16" fill="#1e293b" stroke="#0284c7" stroke-width="2" />
    <rect x="20" y="20" width="280" height="34" rx="8" fill="#0369a1" />
    <text x="160" y="43" fill="#ffffff" font-family="sans-serif" font-size="13" font-weight="700" text-anchor="middle">CAMPOS ACROFORM INTERACTIVOS</text>

    <!-- Simulated Interactive Form Fields -->
    <g transform="translate(25, 75)">
      <!-- Text Field 1 -->
      <text x="0" y="15" fill="#94a3b8" font-family="sans-serif" font-size="11" font-weight="600">Nombre completo / Razón social</text>
      <rect x="0" y="22" width="270" height="28" rx="5" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5" />
      <text x="10" y="41" fill="#f8fafc" font-family="sans-serif" font-size="12">María García Sánchez</text>

      <!-- Checkbox Group -->
      <g transform="translate(0, 65)">
        <rect x="0" y="0" width="18" height="18" rx="4" fill="#0284c7" stroke="#38bdf8" stroke-width="1.5" />
        <polyline points="4,9 7,13 14,4" fill="none" stroke="#ffffff" stroke-width="2" />
        <text x="26" y="14" fill="#cbd5e1" font-family="sans-serif" font-size="12">Acepto los términos de la solicitud</text>
      </g>

      <!-- Dropdown Field -->
      <text x="0" y="112" fill="#94a3b8" font-family="sans-serif" font-size="11" font-weight="600">Modalidad de presentación</text>
      <rect x="0" y="118" width="270" height="28" rx="5" fill="#0f172a" stroke="#475569" stroke-width="1" />
      <text x="10" y="137" fill="#cbd5e1" font-family="sans-serif" font-size="12">Trámite Ordinario</text>
      <polygon points="252,130 258,137 264,130" fill="#94a3b8" />

      <!-- Success indicator -->
      <rect x="0" y="165" width="270" height="24" rx="4" fill="#064e3b" />
      <text x="135" y="181" fill="#a7f3d0" font-family="sans-serif" font-size="10.5" font-weight="700" text-anchor="middle">
        ✓ Detección automática en navegador
      </text>
    </g>
  </g>

  <!-- Center Arrow / Transition -->
  <g transform="translate(425, 305)">
    <rect width="170" height="145" rx="14" fill="#0f172a" stroke="#475569" stroke-width="1.5" />
    <text x="85" y="28" fill="#38bdf8" font-family="sans-serif" font-size="12" font-weight="700" text-anchor="middle">BreadPDF WORKFLOW</text>
    <line x1="20" y1="38" x2="150" y2="38" stroke="#334155" stroke-width="1" />
    <text x="85" y="60" fill="#f8fafc" font-family="sans-serif" font-size="11" text-anchor="middle">1. Rellenar campos</text>
    <text x="85" y="80" fill="#f8fafc" font-family="sans-serif" font-size="11" text-anchor="middle">2. Estampar rúbrica</text>
    <text x="85" y="100" fill="#94a3b8" font-family="sans-serif" font-size="10" text-anchor="middle">3. Aplanar / Exportar</text>
    
    <polygon points="180,72 195,72 195,67 205,77 195,87 195,82 180,82" fill="#38bdf8" />
  </g>

  <!-- Right: Comparison of Two Realities: Visual vs Certificate -->
  <g transform="translate(620, 220)" filter="url(#shadow)">
    <rect width="500" height="320" rx="16" fill="#1e293b" stroke="#334155" stroke-width="2" />
    
    <!-- Top Header -->
    <rect x="0" y="0" width="500" height="42" rx="16" fill="#334155" />
    <text x="25" y="27" fill="#ffffff" font-family="sans-serif" font-size="13" font-weight="700">DISTINCIÓN TÉCNICA Y CONCEPTUAL DE FIRMAS</text>

    <!-- Block A: Firma Visual (Implemented by BreadPDF) -->
    <g transform="translate(20, 58)">
      <rect width="460" height="110" rx="10" fill="#0f172a" stroke="#0284c7" stroke-width="1.5" />
      <rect x="15" y="12" width="130" height="22" rx="4" fill="#0369a1" />
      <text x="80" y="27" fill="#ffffff" font-family="sans-serif" font-size="11" font-weight="700" text-anchor="middle">FIRMA VISUAL / RÚBRICA</text>
      
      <text x="160" y="27" fill="#38bdf8" font-family="sans-serif" font-size="11.5" font-weight="600">Soportada en BreadPDF (Lienzo interactivo)</text>

      <!-- Signature simulation path -->
      <path d="M 30,70 Q 55,45 75,70 T 115,65 T 145,80 T 175,55" fill="none" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round" />
      
      <text x="200" y="65" fill="#cbd5e1" font-family="sans-serif" font-size="11.5">
        • Trazo manuscrito o sello gráfico colocado en la página.
      </text>
      <text x="200" y="85" fill="#94a3b8" font-family="sans-serif" font-size="10.5">
        • Válido para acuerdos internos, modelos y trámites que admitan firma gráfica.
      </text>
    </g>

    <!-- Block B: Firma Digital basada en Certificado (Different Architecture) -->
    <g transform="translate(20, 185)">
      <rect width="460" height="110" rx="10" fill="#0f172a" stroke="#64748b" stroke-width="1" />
      <rect x="15" y="12" width="160" height="22" rx="4" fill="#1e293b" stroke="#64748b" stroke-width="1" />
      <text x="95" y="27" fill="#cbd5e1" font-family="sans-serif" font-size="11" font-weight="700" text-anchor="middle">CERTIFICADO DIGITAL (PKI)</text>
      
      <text x="190" y="27" fill="#94a3b8" font-family="sans-serif" font-size="11.5">Firma electrónica cualificada / X.509</text>

      <!-- Cryptographic symbol -->
      <rect x="35" y="48" width="80" height="48" rx="6" fill="#1e293b" stroke="#475569" stroke-width="1" />
      <circle cx="75" cy="68" r="8" fill="#475569" />
      <path d="M 70,72 L 70,86 L 80,86 L 80,72 Z" fill="#475569" />

      <text x="140" y="62" fill="#cbd5e1" font-family="sans-serif" font-size="11.5">
        • Cifrado asimétrico con certificado emitido por PSC / FNMT / DNIe.
      </text>
      <text x="140" y="82" fill="#f59e0b" font-family="sans-serif" font-size="10.5">
        • Exigido en sedes electrónicas públicas: requiere software o pasarela oficial.
      </text>
    </g>
  </g>

  <!-- Footer Disclaimer -->
  <g transform="translate(100, 585)">
    <text x="0" y="0" fill="#64748b" font-family="sans-serif" font-size="12">
      * Factual disclaimer: Una firma visual no equivale a una firma cualificada basada en certificado criptográfico. Consulta las normas del organismo receptor.
    </text>
  </g>
</svg>
