<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1329" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="ocr-glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>
    <linearGradient id="card-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#334155" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)" />

  <!-- Subtle grid lines -->
  <g opacity="0.05" stroke="#ffffff" stroke-width="1">
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" />
    </pattern>
    <rect width="1200" height="630" fill="url(#grid)" />
  </g>

  <!-- Top Badge / Header -->
  <g transform="translate(100, 50)">
    <rect x="0" y="0" width="375" height="40" rx="20" fill="#312e81" stroke="#6366f1" stroke-width="1.5" />
    <circle cx="20" cy="20" r="7" fill="#818cf8" />
    <text x="36" y="25" fill="#c7d2fe" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700" letter-spacing="1">INVESTIGACIÓN • RECONOCIMIENTO ÓPTICO</text>
  </g>

  <text x="100" y="130" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="34" font-weight="800" letter-spacing="-0.5">
    Cómo hacer buscable un PDF escaneado con OCR
  </text>
  <text x="100" y="166" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="17" font-weight="500">
    De mapa de bits estático a capa tipográfica invisible seleccionable (Ctrl+F)
  </text>

  <!-- Left: Scanned Bitmap Image (No Text Layer) -->
  <g transform="translate(80, 220)" filter="url(#shadow)">
    <rect width="300" height="320" rx="16" fill="#1e293b" stroke="#475569" stroke-width="2" />
    <rect x="20" y="20" width="260" height="34" rx="8" fill="#334155" />
    <text x="150" y="43" fill="#cbd5e1" font-family="sans-serif" font-size="13" font-weight="700" text-anchor="middle">DOCUMENTO ESCANEADO</text>

    <!-- Simulated Scanned Page with pixel grain and skew -->
    <g transform="translate(25, 75)">
      <rect width="250" height="190" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1" />
      
      <!-- Skewed visual text simulation lines -->
      <line x1="20" y1="30" x2="230" y2="32" stroke="#64748b" stroke-width="6" stroke-linecap="round" />
      <line x1="20" y1="52" x2="190" y2="54" stroke="#64748b" stroke-width="6" stroke-linecap="round" />
      <line x1="20" y1="74" x2="215" y2="76" stroke="#64748b" stroke-width="6" stroke-linecap="round" />
      <line x1="20" y1="96" x2="160" y2="98" stroke="#64748b" stroke-width="6" stroke-linecap="round" />
      
      <line x1="20" y1="125" x2="225" y2="127" stroke="#475569" stroke-width="5" stroke-linecap="round" />
      <line x1="20" y1="145" x2="180" y2="147" stroke="#475569" stroke-width="5" stroke-linecap="round" />

      <!-- Red warning badge -->
      <rect x="20" y="160" width="210" height="22" rx="4" fill="#7f1d1d" />
      <text x="125" y="175" fill="#fca5a5" font-family="sans-serif" font-size="10" font-weight="700" text-anchor="middle">
        SIN CAPA DE TEXTO (IMAGEN PURA)
      </text>
    </g>

    <text x="150" y="295" fill="#94a3b8" font-family="sans-serif" font-size="11" text-anchor="middle">
      No se puede buscar con Ctrl+F ni copiar texto
    </text>
  </g>

  <!-- Center Arrow / OCR Engine -->
  <g transform="translate(415, 305)">
    <rect width="180" height="145" rx="14" fill="#1e1b4b" stroke="#6366f1" stroke-width="2" />
    <text x="90" y="30" fill="#a5b4fc" font-family="sans-serif" font-size="13" font-weight="800" text-anchor="middle">MOTOR OCR BreadPDF</text>
    <line x1="20" y1="42" x2="160" y2="42" stroke="#4338ca" stroke-width="1" />
    <text x="90" y="65" fill="#e0e7ff" font-family="sans-serif" font-size="11" text-anchor="middle">Análisis de glifos</text>
    <text x="90" y="85" fill="#c7d2fe" font-family="sans-serif" font-size="10.5" text-anchor="middle">Diccionario de idioma</text>
    <text x="90" y="105" fill="#818cf8" font-family="sans-serif" font-size="10" text-anchor="middle">Alineación geométrica</text>
    
    <polygon points="190,72 205,72 205,67 215,77 205,87 205,82 190,82" fill="#818cf8" />
  </g>

  <!-- Right: Searchable PDF with Invisible Text Layer -->
  <g transform="translate(640, 220)" filter="url(#shadow)">
    <rect width="480" height="320" rx="16" fill="#1e293b" stroke="#6366f1" stroke-width="2" />
    <rect x="0" y="0" width="480" height="42" rx="16" fill="url(#ocr-glow)" />
    <text x="25" y="27" fill="#ffffff" font-family="sans-serif" font-size="14" font-weight="700">PDF BUSCABLE (CAPA DE TEXTO INVISIBLE)</text>
    <rect x="360" y="10" width="105" height="22" rx="4" fill="#312e81" />
    <text x="412" y="25" fill="#e0e7ff" font-family="sans-serif" font-size="10.5" font-weight="700" text-anchor="middle">SELECCIONABLE</text>

    <!-- Document Content with OCR Highlights -->
    <g transform="translate(25, 60)">
      <!-- Search bar simulation -->
      <rect x="0" y="0" width="430" height="32" rx="6" fill="#0f172a" stroke="#4338ca" stroke-width="1" />
      <text x="15" y="21" fill="#818cf8" font-family="monospace" font-size="12">Ctrl + F: "investigación"</text>
      <rect x="330" y="6" width="85" height="20" rx="4" fill="#4338ca" />
      <text x="372" y="20" fill="#ffffff" font-family="sans-serif" font-size="10" font-weight="700" text-anchor="middle">3 COINCIDENCIAS</text>

      <!-- Page Simulation with highlight -->
      <g transform="translate(0, 48)">
        <rect width="430" height="150" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1" />
        
        <text x="20" y="32" fill="#f8fafc" font-family="sans-serif" font-size="13">
          El presente informe de <tspan fill="#fef08a" font-weight="700">investigación</tspan> compila los
        </text>
        <text x="20" y="56" fill="#f8fafc" font-family="sans-serif" font-size="13">
          datos recopilados en el archivo histórico general...
        </text>

        <!-- Selection highlight rectangle -->
        <rect x="20" y="74" width="370" height="26" rx="4" fill="#2563eb" fill-opacity="0.35" stroke="#3b82f6" stroke-width="1" />
        <text x="28" y="92" fill="#93c5fd" font-family="sans-serif" font-size="12">
          Texto seleccionado con cursor listo para copiar (Ctrl+C)
        </text>

        <rect x="20" y="115" width="280" height="18" rx="3" fill="#064e3b" />
        <text x="28" y="128" fill="#a7f3d0" font-family="sans-serif" font-size="10.5" font-weight="600">
          ✓ Capa vectorial invisible sobre la imagen original
        </text>
      </g>

      <text x="0" y="222" fill="#94a3b8" font-family="sans-serif" font-size="11.5">
        Conserva la apariencia exacta del escaneo permitiendo búsqueda indexada
      </text>
    </g>
  </g>

  <!-- Footer Disclaimer -->
  <g transform="translate(100, 585)">
    <text x="0" y="0" fill="#64748b" font-family="sans-serif" font-size="12">
      * Factual disclaimer: El OCR es un proceso de reconocimiento óptico dependiente de resolución, contraste y nitidez tipográfica.
    </text>
  </g>
</svg>
