<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B1220" />
      <stop offset="50%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#1E293B" />
    </linearGradient>
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#0F172A" stop-opacity="0.95" />
    </linearGradient>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3B82F6" />
      <stop offset="100%" stop-color="#2563EB" />
    </linearGradient>
    <linearGradient id="amberGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#000000" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)" />

  <!-- Technical Grid -->
  <g opacity="0.05" stroke="#94A3B8" stroke-width="1">
    <line x1="0" y1="126" x2="1200" y2="126" />
    <line x1="0" y1="252" x2="1200" y2="252" />
    <line x1="0" y1="378" x2="1200" y2="378" />
    <line x1="0" y1="504" x2="1200" y2="504" />
    <line x1="240" y1="0" x2="240" y2="630" />
    <line x1="480" y1="0" x2="480" y2="630" />
    <line x1="720" y1="0" x2="720" y2="630" />
    <line x1="960" y1="0" x2="960" y2="630" />
  </g>

  <!-- Top Header / Brand -->
  <g transform="translate(80, 65)">
    <rect width="42" height="42" rx="10" fill="url(#primaryGrad)" />
    <text x="56" y="29" fill="#F8FAFC" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="900" letter-spacing="0.05em">BreadPDF</text>
    <rect x="150" y="8" width="230" height="26" rx="13" fill="#1E293B" stroke="#334155" />
    <text x="265" y="25" text-anchor="middle" fill="#38BDF8" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" letter-spacing="0.08em">ESTÁNDARES & ARCHIVO DIGITAL</text>
  </g>

  <!-- Process Flow Layout: 4 Step Nodes across the width -->
  <g transform="translate(80, 150)">
    <!-- Stage 1: PDF Convencional -->
    <g filter="url(#shadow)">
      <rect x="0" y="30" width="220" height="320" rx="16" fill="url(#cardBg)" stroke="#334155" stroke-width="1.5" />
      <rect x="20" y="50" width="60" height="24" rx="6" fill="#64748B" fill-opacity="0.2" stroke="#64748B" stroke-width="1" />
      <text x="50" y="66" text-anchor="middle" fill="#94A3B8" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700">PASO 01</text>
      
      <text x="20" y="105" fill="#F8FAFC" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="800">PDF Estándar</text>
      <text x="20" y="130" fill="#94A3B8" font-family="system-ui, -apple-system, sans-serif" font-size="13">Documento de trabajo</text>

      <line x1="20" y1="150" x2="200" y2="150" stroke="#334155" stroke-width="1" />

      <g transform="translate(20, 170)">
        <text x="0" y="0" fill="#E2E8F0" font-family="system-ui, -apple-system, sans-serif" font-size="12.5" font-weight="600">• Fuentes externas</text>
        <text x="0" y="24" fill="#E2E8F0" font-family="system-ui, -apple-system, sans-serif" font-size="12.5" font-weight="600">• Scripts dinámicos</text>
        <text x="0" y="48" fill="#E2E8F0" font-family="system-ui, -apple-system, sans-serif" font-size="12.5" font-weight="600">• Formularios XFA</text>
        <text x="0" y="72" fill="#E2E8F0" font-family="system-ui, -apple-system, sans-serif" font-size="12.5" font-weight="600">• Multimedia incrustada</text>
      </g>
      <rect x="20" y="275" width="180" height="50" rx="8" fill="#0F172A" stroke="#1E293B" />
      <text x="30" y="296" fill="#F87171" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700">Riesgo a largo plazo:</text>
      <text x="30" y="313" fill="#94A3B8" font-family="system-ui, -apple-system, sans-serif" font-size="11">Incompatibilidad futura</text>
    </g>

    <!-- Arrow 1 -> 2 -->
    <g transform="translate(235, 175)">
      <circle cx="17" cy="15" r="15" fill="#1E293B" stroke="#3B82F6" stroke-width="1.5" />
      <path d="M14 9 L21 15 L14 21" fill="none" stroke="#38BDF8" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
    </g>

    <!-- Stage 2: Requisitos de Archivo -->
    <g transform="translate(275, 0)" filter="url(#shadow)">
      <rect x="0" y="30" width="220" height="320" rx="16" fill="url(#cardBg)" stroke="#3B82F6" stroke-width="1.5" />
      <rect x="20" y="50" width="60" height="24" rx="6" fill="#2563EB" fill-opacity="0.2" stroke="#3B82F6" stroke-width="1" />
      <text x="50" y="66" text-anchor="middle" fill="#60A5FA" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700">PASO 02</text>
      
      <text x="20" y="105" fill="#F8FAFC" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="800">Requisitos</text>
      <text x="20" y="130" fill="#94A3B8" font-family="system-ui, -apple-system, sans-serif" font-size="13">Exigencia normativa</text>

      <line x1="20" y1="150" x2="200" y2="150" stroke="#334155" stroke-width="1" />

      <g transform="translate(20, 170)">
        <text x="0" y="0" fill="#E2E8F0" font-family="system-ui, -apple-system, sans-serif" font-size="12.5" font-weight="600">• Identificar organismo</text>
        <text x="0" y="24" fill="#E2E8F0" font-family="system-ui, -apple-system, sans-serif" font-size="12.5" font-weight="600">• Variante: 1b, 2b, 3</text>
        <text x="0" y="48" fill="#E2E8F0" font-family="system-ui, -apple-system, sans-serif" font-size="12.5" font-weight="600">• Perfil de color ICC</text>
        <text x="0" y="72" fill="#E2E8F0" font-family="system-ui, -apple-system, sans-serif" font-size="12.5" font-weight="600">• Política documental</text>
      </g>
      <rect x="20" y="275" width="180" height="50" rx="8" fill="#0F172A" stroke="#1E293B" />
      <text x="30" y="296" fill="#60A5FA" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700">Comprobación previa:</text>
      <text x="30" y="313" fill="#94A3B8" font-family="system-ui, -apple-system, sans-serif" font-size="11">Pliego o sede pública</text>
    </g>

    <!-- Arrow 2 -> 3 -->
    <g transform="translate(510, 175)">
      <circle cx="17" cy="15" r="15" fill="#1E293B" stroke="#3B82F6" stroke-width="1.5" />
      <path d="M14 9 L21 15 L14 21" fill="none" stroke="#38BDF8" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
    </g>

    <!-- Stage 3: Conversión Estructural PDF/A -->
    <g transform="translate(550, 0)" filter="url(#shadow)">
      <rect x="0" y="30" width="220" height="320" rx="16" fill="url(#cardBg)" stroke="#059669" stroke-width="1.5" />
      <rect x="20" y="50" width="60" height="24" rx="6" fill="#059669" fill-opacity="0.2" stroke="#10B981" stroke-width="1" />
      <text x="50" y="66" text-anchor="middle" fill="#34D399" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700">PASO 03</text>
      
      <text x="20" y="105" fill="#F8FAFC" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="800">Conversión</text>
      <text x="20" y="130" fill="#34D399" font-family="system-ui, -apple-system, sans-serif" font-size="13">BreadPDF pdf-a-pdfa</text>

      <line x1="20" y1="150" x2="200" y2="150" stroke="#334155" stroke-width="1" />

      <g transform="translate(20, 170)">
        <text x="0" y="0" fill="#E2E8F0" font-family="system-ui, -apple-system, sans-serif" font-size="12.5" font-weight="600">• Inyección XMP ISO</text>
        <text x="0" y="24" fill="#E2E8F0" font-family="system-ui, -apple-system, sans-serif" font-size="12.5" font-weight="600">• Flujos sin compresión</text>
        <text x="0" y="48" fill="#E2E8F0" font-family="system-ui, -apple-system, sans-serif" font-size="12.5" font-weight="600">• Neutralizar dinámicos</text>
        <text x="0" y="72" fill="#E2E8F0" font-family="system-ui, -apple-system, sans-serif" font-size="12.5" font-weight="600">• Metadatos canónicos</text>
      </g>
      <rect x="20" y="275" width="180" height="50" rx="8" fill="#064E3B" fill-opacity="0.5" stroke="#059669" />
      <text x="30" y="296" fill="#34D399" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700">Transformación:</text>
      <text x="30" y="313" fill="#A7F3D0" font-family="system-ui, -apple-system, sans-serif" font-size="11">Estructura preservable</text>
    </g>

    <!-- Arrow 3 -> 4 -->
    <g transform="translate(785, 175)">
      <circle cx="17" cy="15" r="15" fill="#1E293B" stroke="#F59E0B" stroke-width="1.5" />
      <path d="M14 9 L21 15 L14 21" fill="none" stroke="#FBBF24" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
    </g>

    <!-- Stage 4: Validación Externa (Distinct Phase) -->
    <g transform="translate(825, 0)" filter="url(#shadow)">
      <rect x="0" y="30" width="220" height="320" rx="16" fill="url(#cardBg)" stroke="#D97706" stroke-width="2" />
      <rect x="20" y="50" width="60" height="24" rx="6" fill="#D97706" fill-opacity="0.2" stroke="#F59E0B" stroke-width="1" />
      <text x="50" y="66" text-anchor="middle" fill="#FBBF24" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700">PASO 04</text>
      
      <text x="20" y="105" fill="#F8FAFC" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="800">Validación</text>
      <text x="20" y="130" fill="#FBBF24" font-family="system-ui, -apple-system, sans-serif" font-size="13">Comprobación formal</text>

      <line x1="20" y1="150" x2="200" y2="150" stroke="#334155" stroke-width="1" />

      <g transform="translate(20, 170)">
        <text x="0" y="0" fill="#E2E8F0" font-family="system-ui, -apple-system, sans-serif" font-size="12.5" font-weight="600">• VeraPDF / Validador</text>
        <text x="0" y="24" fill="#E2E8F0" font-family="system-ui, -apple-system, sans-serif" font-size="12.5" font-weight="600">• Revisión visual total</text>
        <text x="0" y="48" fill="#E2E8F0" font-family="system-ui, -apple-system, sans-serif" font-size="12.5" font-weight="600">• Sede administrativa</text>
        <text x="0" y="72" fill="#E2E8F0" font-family="system-ui, -apple-system, sans-serif" font-size="12.5" font-weight="600">• Registro de entrada</text>
      </g>
      <rect x="20" y="275" width="180" height="50" rx="8" fill="#451A03" fill-opacity="0.6" stroke="#D97706" />
      <text x="30" y="296" fill="#FBBF24" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700">Principio Factual:</text>
      <text x="30" y="313" fill="#FDE68A" font-family="system-ui, -apple-system, sans-serif" font-size="11">Conversión ≠ Certificación</text>
    </g>
  </g>

  <!-- Footer Features -->
  <g transform="translate(80, 560)">
    <text x="0" y="20" fill="#94A3B8" font-family="system-ui, -apple-system, sans-serif" font-size="14.5" font-weight="600">
      Archivo Documental • ISO 19005 • Administraciones Públicas • Preservación a Largo Plazo
    </text>
    <text x="1040" y="20" text-anchor="end" fill="#64748B" font-family="system-ui, -apple-system, sans-serif" font-size="14">
      breadpdf.com
    </text>
  </g>
</svg>
