<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-labelledby="title desc">
  <title id="title">Cómo convertir un PDF a Word editable</title>
  <desc id="desc">Flujo en cuatro etapas: PDF con capa de texto, extracción de líneas, marcadores de página y documento DOCX editable. Se conserva el texto; no se conservan imágenes, fuentes ni diseño.</desc>
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B1220" />
      <stop offset="55%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#1E293B" />
    </linearGradient>
    <linearGradient id="card" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" stop-opacity="0.98" />
      <stop offset="100%" stop-color="#0F172A" stop-opacity="0.98" />
    </linearGradient>
    <linearGradient id="red" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EF4444" />
      <stop offset="100%" stop-color="#C9302C" />
    </linearGradient>
    <linearGradient id="blue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3B82F6" />
      <stop offset="100%" stop-color="#2563EB" />
    </linearGradient>
    <linearGradient id="green" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <filter id="shadow" x="-15%" y="-15%" width="130%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#000000" flood-opacity="0.45" />
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748B" />
    </marker>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)" />

  <g opacity="0.05" stroke="#94A3B8" stroke-width="1">
    <line x1="0" y1="126" x2="1200" y2="126" />
    <line x1="0" y1="252" x2="1200" y2="252" />
    <line x1="0" y1="378" x2="1200" y2="378" />
    <line x1="0" y1="504" x2="1200" y2="504" />
    <line x1="240" y1="0" x2="240" y2="630" />
    <line x1="480" y1="0" x2="480" y2="630" />
    <line x1="720" y1="0" x2="720" y2="630" />
    <line x1="960" y1="0" x2="960" y2="630" />
  </g>

  <!-- Header -->
  <g>
    <rect x="60" y="42" width="230" height="30" rx="8" fill="#C9302C" />
    <text x="74" y="62" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" letter-spacing="1.6" fill="#FFFFFF">CONVERSIÓN LOCAL</text>
    <text x="60" y="116" font-family="Arial, Helvetica, sans-serif" font-size="40" font-weight="800" fill="#F8FAFC">PDF → WORD EDITABLE</text>
    <text x="60" y="148" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#94A3B8">Del texto seleccionable a un .docx que puedes reescribir: esto es lo que ocurre en cada etapa.</text>
    <text x="1140" y="62" text-anchor="end" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" fill="#64748B">BREADPDF</text>
  </g>

  <!-- Stage 1 -->
  <g filter="url(#shadow)">
    <rect x="60" y="190" width="240" height="270" rx="18" fill="url(#card)" stroke="#334155" stroke-width="1.5" />
  </g>
  <rect x="84" y="214" width="192" height="130" rx="8" fill="#0B1220" stroke="#475569" stroke-width="1.5" />
  <g fill="#64748B">
    <rect x="100" y="232" width="120" height="8" rx="4" />
    <rect x="100" y="252" width="150" height="6" rx="3" />
    <rect x="100" y="268" width="132" height="6" rx="3" />
    <rect x="100" y="288" width="96" height="6" rx="3" />
    <rect x="100" y="308" width="142" height="6" rx="3" />
  </g>
  <rect x="84" y="214" width="192" height="130" rx="8" fill="none" stroke="#3B82F6" stroke-width="2" stroke-dasharray="6 5" />
  <text x="84" y="376" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700" fill="#3B82F6">CAPA DE TEXTO</text>
  <text x="84" y="404" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="800" fill="#F8FAFC">PDF de origen</text>
  <text x="84" y="430" font-family="Arial, Helvetica, sans-serif" font-size="13.5" fill="#94A3B8">Texto digital, no una foto.</text>
  <text x="84" y="448" font-family="Arial, Helvetica, sans-serif" font-size="13.5" fill="#94A3B8">Si es un escaneo, OCR primero.</text>

  <line x1="310" y1="325" x2="348" y2="325" stroke="#64748B" stroke-width="2.5" marker-end="url(#arrow)" />

  <!-- Stage 2 -->
  <g filter="url(#shadow)">
    <rect x="360" y="190" width="240" height="270" rx="18" fill="url(#card)" stroke="#334155" stroke-width="1.5" />
  </g>
  <g font-family="Arial, Helvetica, sans-serif">
    <rect x="384" y="214" width="192" height="130" rx="8" fill="#0B1220" stroke="#475569" stroke-width="1.5" />
    <g fill="#3B82F6">
      <rect x="400" y="236" width="130" height="7" rx="3.5" />
      <rect x="400" y="254" width="158" height="7" rx="3.5" />
      <rect x="400" y="272" width="104" height="7" rx="3.5" />
      <rect x="400" y="298" width="146" height="7" rx="3.5" />
      <rect x="400" y="316" width="118" height="7" rx="3.5" />
    </g>
    <g stroke="#F59E0B" stroke-width="1.2" stroke-dasharray="4 4">
      <line x1="392" y1="239.5" x2="560" y2="239.5" />
      <line x1="392" y1="257.5" x2="560" y2="257.5" />
      <line x1="392" y1="275.5" x2="560" y2="275.5" />
      <line x1="392" y1="301.5" x2="560" y2="301.5" />
      <line x1="392" y1="319.5" x2="560" y2="319.5" />
    </g>
  </g>
  <text x="384" y="376" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700" fill="#3B82F6">AGRUPACIÓN POR LÍNEAS</text>
  <text x="384" y="404" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="800" fill="#F8FAFC">Extracción de texto</text>
  <text x="384" y="430" font-family="Arial, Helvetica, sans-serif" font-size="13.5" fill="#94A3B8">Cada línea visual se vuelve</text>
  <text x="384" y="448" font-family="Arial, Helvetica, sans-serif" font-size="13.5" fill="#94A3B8">un párrafo editable.</text>

  <line x1="610" y1="325" x2="648" y2="325" stroke="#64748B" stroke-width="2.5" marker-end="url(#arrow)" />

  <!-- Stage 3 -->
  <g filter="url(#shadow)">
    <rect x="660" y="190" width="240" height="270" rx="18" fill="url(#card)" stroke="#334155" stroke-width="1.5" />
  </g>
  <rect x="684" y="214" width="192" height="130" rx="8" fill="#0B1220" stroke="#475569" stroke-width="1.5" />
  <text x="700" y="246" font-family="Arial, Helvetica, sans-serif" font-size="13" font-style="italic" fill="#94A3B8">--- Página 1 ---</text>
  <g fill="#475569">
    <rect x="700" y="260" width="150" height="6" rx="3" />
    <rect x="700" y="276" width="120" height="6" rx="3" />
    <rect x="700" y="292" width="140" height="6" rx="3" />
  </g>
  <text x="700" y="322" font-family="Arial, Helvetica, sans-serif" font-size="13" font-style="italic" fill="#94A3B8">--- Página 2 ---</text>
  <g fill="#475569">
    <rect x="700" y="334" width="132" height="6" rx="3" />
  </g>
  <text x="684" y="376" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700" fill="#F59E0B">MARCADORES DE PÁGINA</text>
  <text x="684" y="404" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="800" fill="#F8FAFC">Orden conservado</text>
  <text x="684" y="430" font-family="Arial, Helvetica, sans-serif" font-size="13.5" fill="#94A3B8">Arriba → abajo, izquierda</text>
  <text x="684" y="448" font-family="Arial, Helvetica, sans-serif" font-size="13.5" fill="#94A3B8">→ derecha en cada página.</text>

  <line x1="910" y1="325" x2="948" y2="325" stroke="#64748B" stroke-width="2.5" marker-end="url(#arrow)" />

  <!-- Stage 4 -->
  <g filter="url(#shadow)">
    <rect x="960" y="190" width="180" height="270" rx="18" fill="url(#card)" stroke="#10B981" stroke-width="1.5" />
  </g>
  <rect x="984" y="214" width="132" height="130" rx="8" fill="#0B1220" stroke="#475569" stroke-width="1.5" />
  <g>
    <rect x="1000" y="232" width="40" height="9" rx="4" fill="#10B981" />
    <rect x="1000" y="252" width="72" height="7" rx="3.5" fill="#059669" opacity="0.9" />
    <rect x="1000" y="270" width="96" height="5" rx="2.5" fill="#475569" />
    <rect x="1000" y="284" width="88" height="5" rx="2.5" fill="#475569" />
    <rect x="1000" y="298" width="94" height="5" rx="2.5" fill="#475569" />
    <rect x="1000" y="316" width="64" height="5" rx="2.5" fill="#475569" />
  </g>
  <text x="984" y="376" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700" fill="#10B981">SALIDA .DOCX</text>
  <text x="984" y="404" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="800" fill="#F8FAFC">Word editable</text>
  <text x="984" y="430" font-family="Arial, Helvetica, sans-serif" font-size="13.5" fill="#94A3B8">Word, LibreOffice y</text>
  <text x="984" y="448" font-family="Arial, Helvetica, sans-serif" font-size="13.5" fill="#94A3B8">Google Docs.</text>

  <!-- Footer legend -->
  <rect x="60" y="496" width="1080" height="88" rx="14" fill="#0B1220" stroke="#1E293B" stroke-width="1.5" />
  <circle cx="92" cy="522" r="7" fill="#10B981" />
  <text x="110" y="527" font-family="Arial, Helvetica, sans-serif" font-size="14.5" font-weight="700" fill="#D1FAE5">SE CONSERVA</text>
  <text x="110" y="552" font-family="Arial, Helvetica, sans-serif" font-size="13.5" fill="#94A3B8">Texto seleccionable · orden por líneas · marcadores de página</text>

  <circle cx="640" cy="522" r="7" fill="#EF4444" />
  <text x="658" y="527" font-family="Arial, Helvetica, sans-serif" font-size="14.5" font-weight="700" fill="#FEE2E2">NO SE CONSERVA</text>
  <text x="658" y="552" font-family="Arial, Helvetica, sans-serif" font-size="13.5" fill="#94A3B8">Imágenes · fuentes y colores · maquetación y tablas reales</text>
</svg>
